{% set PKG_NAME = 'dropbot' %}
{% set LIB_NAME = 'Dropbot' %}
{% set MODULE_NAME = PKG_NAME.replace('-', '_') %}
{% set PLATFORMIO_ENVS = 'teensy31'.split(' ') %}

source:
  git_url: ../

package:
  name: {{ PKG_NAME }}
  version: 2.0

build:
  noarch: python
  script:
    # Ensure Python script is executed in a clean environment
    - python generate_python_files.py
    # Install the Python package using pip for better compatibility
    - pip install . --no-deps --ignore-installed --no-cache-dir

requirements:
  build:
    - python {{ python }}
    - protobuf 3.20.3
    - protoc 3.1.0
    - six
    - base-node-rpc
    - m2w64-toolchain

  run:
      - python {{ python }}
      - protobuf 3.20.3
      - protoc 3.1.0
      - six
      - base-node-rpc
      - teensy-minimal-rpc
      - base-node
      - bs4
      - pandoc
      - pypandoc
      - tqdm
      - matplotlib
      - svg-model
      - m2w64-toolchain  # this should not be here, but in nadamq. That update needs to be done at some point. Workaround it by having this here. If in an environemnt with dropbot.py already installed. We cna just install with --no-deps option.

test:
  imports:
    # .. versionchanged:: 1.37.2
    - {{ MODULE_NAME }}
    - {{ MODULE_NAME + '.config' }}
    - {{ MODULE_NAME + '.proxy' }}
    - {{ MODULE_NAME + '.state' }}
    - {{ MODULE_NAME + '.metadata' }}

about:
  home: https://github.com/sci-bots/{{ PKG_NAME }}
  license: MIT
  summary: Dropbot API
